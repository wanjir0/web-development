<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="note-card">
      <h1>Note Counter</h1>
      <label for="note-text">Your note</label>
      <textarea
        id="note-text"
        rows="8"
        placeholder="Start writing..."
      ></textarea>
      <div class="counts" aria-live="polite">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>
      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </main>
  </body>
</html>
